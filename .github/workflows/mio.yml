on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/**'
      - '.idea/**'
      - '!.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}
    outputs:
      apk_file: ${{ steps.find_apk.outputs.apk_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: gradle

      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: gradle-deps-core-${{ hashFiles('**/build.gradle.kts', '**/build.gradle', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-deps

      - name: Cache Gradle Build
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-core-${{ github.sha }}
          restore-keys: |
            gradle-builds

      - name: Setup SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          mkdir -p "$ANDROID_HOME/licenses/"
          echo -n "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.1"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          if [ ! -f keystore.jks ]; then
            echo "❌ Keystore file not created!"
            exit 1
          fi
          echo "✅ Keystore file created successfully"

      - name: Build with Gradle
        run: |
          set -e
          ./gradlew clean
          ./gradlew :app:assembleRelease --stacktrace --info 2>&1 | tee build.log
        env:
          KEYSTORE_PATH: "../keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        continue-on-error: false

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_log_failed
          path: build.log

      - name: Find APK file
        id: find_apk
        run: |
          apk_file=$(find ./app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          if [ -z "$apk_file" ]; then
            echo "❌ No APK file found!"
            ls -la ./app/build/outputs/apk/release/ || echo "Release directory does not exist"
            exit 1
          fi
          echo "✅ APK file found: $apk_file"
          echo "apk_path=$apk_file" >> $GITHUB_ENV
          echo "apk_path=$apk_file" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk_file
          path: ${{ env.apk_path }}

      - name: Upload Build Log Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: build.log

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: apk_file
          path: apk_artifact

      - name: Locate APK file
        id: locate_apk
        run: |
          apk_file=$(find apk_artifact -type f -name '*.apk' | head -n 1)
          if [ -z "$apk_file" ]; then
            echo "❌ No APK file found in artifact!"
            exit 1
          fi
          echo "✅ APK file located: $apk_file"
          echo "apk_file=$apk_file" >> $GITHUB_OUTPUT

      - name: Get versionName
        id: get_version
        run: |
          version=$(grep 'versionName' app/build.gradle | head -n1 | sed 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/')
          if [ -z "$version" ]; then
            version="1.0.0"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create Pre-Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
          name: v${{ steps.get_version.outputs.version }} (${{ github.sha }})
          body: |
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: true
          files: |
            ${{ steps.locate_apk.outputs.apk_file }}

      - name: Download Build Log Artifact
        uses: actions/download-artifact@v4
        with:
          name: build_log
          path: build_log

      - name: Upload Build Log to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
          files: |
            build_log/build.log